<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11151a">
  <meta name="robots" content="noindex,nofollow">
  <title>고객 작성내용 — HAO</title>
  <link rel="manifest" href="app.webmanifest">
  <link rel="icon" href="assets/app-icons/hao-192.png" type="image/png">
  <style>
    :root{color-scheme:dark;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;--bg:#0f1318;--panel:#191f26;--panel2:#151a20;--line:#303a46;--ink:#f5f7fa;--sub:#9daaba;--blue:#3478ef;--green:#62dda1;--red:#ff7189}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(circle at 86% 0,rgba(52,120,239,.14),transparent 28%),var(--bg);color:var(--ink)}button,input,select{font:inherit}main{width:min(1280px,calc(100% - 32px));margin:0 auto;padding:42px 0 80px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.eyebrow{margin:0 0 8px;color:#ff5b78;font-size:11px;font-weight:900;letter-spacing:.14em}h1{margin:0;font-size:clamp(30px,5vw,52px);letter-spacing:-.05em}.intro{max-width:760px;margin:14px 0 0;color:var(--sub);line-height:1.7}.back{display:inline-flex;align-items:center;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 15px;color:var(--ink);text-decoration:none;font-weight:850;background:#171d24}.auth,.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel)}.auth[hidden]{display:none}.auth input,.filters input,.filters select{min-height:44px;border:1px solid #3b4653;border-radius:10px;padding:0 13px;background:#11161c;color:#fff}.auth input{flex:1 1 320px}.filters input{flex:1 1 300px}.filters select{min-width:180px}.primary,.secondary,.file-button{min-height:44px;border:1px solid #397be9;border-radius:10px;padding:0 16px;background:#2868d8;color:#fff;font-weight:900;cursor:pointer}.secondary,.file-button{border-color:#3a4653;background:#202832}.message{min-height:24px;margin:12px 2px 0;color:#aab6c4;font-size:13px}.message.error{color:var(--red)}.summary{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:20px 0 12px}.summary strong{font-size:17px}.summary span{color:var(--sub);font-size:13px}.list{display:grid;gap:12px}.project{border:1px solid var(--line);border-radius:17px;background:var(--panel);overflow:hidden}.project summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px;cursor:pointer;list-style:none}.project summary::-webkit-details-marker{display:none}.project-title strong{display:block;font-size:18px}.project-title span{display:block;margin-top:6px;color:var(--sub);font-size:13px;line-height:1.55}.state{border:1px solid rgba(98,221,161,.28);border-radius:999px;padding:8px 11px;background:rgba(98,221,161,.08);color:#78dfac;font-size:12px;font-weight:900;white-space:nowrap}.project-body{border-top:1px solid var(--line);padding:20px}.project-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:18px}.project-actions select{min-height:42px;border:1px solid #3a4653;border-radius:10px;padding:0 12px;background:#11161c;color:#fff}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{min-width:0;border:1px solid #2b3540;border-radius:12px;padding:14px;background:var(--panel2)}.field.wide{grid-column:1/-1}.field b{display:block;margin-bottom:7px;color:#7ea9ff;font-size:11px}.field span{display:block;color:#e5e9ee;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.field .missing{color:#7d8997}.files{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.files h3{margin:0 0 10px;font-size:15px}.file-list{display:flex;flex-wrap:wrap;gap:8px}.file-button{min-height:38px;font-size:12px}.empty{border:1px dashed #384350;border-radius:16px;padding:40px;text-align:center;color:var(--sub)}
    @media(max-width:720px){main{width:min(100% - 20px,1280px);padding:24px 0 56px}.top{display:block}.back{margin-top:18px;width:100%;justify-content:center}.auth,.filters{display:grid;padding:12px}.auth input,.filters input,.filters select,.auth button{width:100%;min-width:0}.summary{align-items:flex-start}.project summary{grid-template-columns:1fr;padding:16px}.state{justify-self:start}.project-body{padding:14px}.project-actions{display:grid}.project-actions>*{width:100%}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.file-list{display:grid}.file-button{width:100%;min-height:44px;text-align:left}h1{font-size:34px}}
    .triage-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.triage-stats span{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--panel);color:var(--sub)}.triage-stats b{display:block;margin-bottom:4px;color:#fff;font-size:24px}.triage-stats .good{border-color:rgba(98,221,161,.32)}.triage-stats .warn{border-color:rgba(255,177,74,.38)}.state.promoted{color:#78dfac}.state.needs{border-color:rgba(255,177,74,.38);background:rgba(255,177,74,.08);color:#ffbd67}.score-track{height:5px;margin-top:11px;border-radius:99px;background:#2a333d;overflow:hidden}.score-track i{display:block;height:100%;background:#3478ef}.missing-guide{display:grid;gap:5px;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;padding:13px}.missing-guide span{color:var(--sub);font-size:13px;line-height:1.6}.missing-guide.needs{border-color:rgba(255,177,74,.3);background:rgba(255,177,74,.05)}
    @media(max-width:720px){.triage-stats{grid-template-columns:1fr}.triage-stats span{padding:12px}}
  </style>
</head>
<body>
  <main>
    <header class="top">
      <div><p class="eyebrow">HAO SERVER SUBMISSIONS</p><h1>고객 작성내용</h1><p class="intro">고객 작성폼에서 중앙 서버로 접수된 프로젝트와 첨부자료를 한 화면에서 확인합니다. 관리자 키는 현재 탭에만 보관됩니다.</p></div>
      <a class="back" href="START_HERE.html">← 프로그램 관리</a>
    </header>
    <section class="auth" id="authPanel" hidden>
      <input id="adminToken" type="password" autocomplete="off" placeholder="중앙 서버 관리자 키">
      <button class="primary" id="authenticate" type="button">인증하고 전체목록 불러오기</button>
    </section>
    <section class="filters">
      <input id="search" type="search" placeholder="고객사·제품명·접수번호 검색">
      <select id="statusFilter"><option value="">전체 상태</option></select>
      <select id="intakeFilter"><option value="">전체 작성률</option><option value="promoted">60% 이상 · 프로젝트 자동 등록</option><option value="needs-more-info">60% 미만 · 보완 필요</option></select>
      <button class="secondary" id="refresh" type="button">새로고침</button>
    </section>
    <p class="message" id="message" role="status">서버 목록을 확인하고 있습니다…</p>
    <div class="summary"><strong id="count">0개 프로젝트</strong><span>상태 변경은 중앙 서버 진행조회에 즉시 반영됩니다.</span></div>
    <div class="triage-stats" id="intakeStats"><span><b>0</b>전체 접수</span><span class="good"><b>0</b>프로젝트 자동 등록</span><span class="warn"><b>0</b>보완 필요</span></div>
    <section class="list" id="projectList"></section>
  </main>
  <script src="hao-config.js?v=20260820-drive1"></script>
  <script src="submission-sync.js?v=20260828-server-auth4"></script>
  <script src="intake-triage.js?v=20260901-intake1"></script>
  <script>
  if (false) {
    const $=id=>document.getElementById(id);let projects=[];
    const statuses=["신규 접수","확인 중","검수 완료","기획 생성","1차 시안 완료","고객 컨펌 대기","실제 제작","내부 검수","최종 납품"];
    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    const text=value=>Array.isArray(value)?value.map(item=>typeof item==="object"?Object.values(item).filter(Boolean).join(" · "):item).join("\n"):typeof value==="object"&&value?JSON.stringify(value,null,2):String(value||"");
    const keyOf=project=>String(project.id||project.cloudSubmissionId||project.submissionId||"");
    const receiptOf=project=>String(project.receiptNo||project.receipt||project.cloudReceiptNo||"미발급");
    const progressFor=status=>{const map={"신규 접수":[1,"접수 완료","작성 내용이 정상적으로 접수되었습니다."],"확인 중":[2,"자료 확인 중","담당 관리자가 작성 내용과 첨부 자료를 확인하고 있습니다."],"검수 완료":[3,"내용 검수 완료","검수가 완료되어 1차 시안을 준비합니다."],"기획 생성":[4,"1차 시안 제작 중","촬영·디자인 기획 시안을 제작하고 있습니다."],"1차 시안 완료":[5,"1차 시안 검수·수정","1차 시안 검수와 보완을 진행하고 있습니다."],"고객 컨펌 대기":[6,"고객 확인·피드백","고객의 시안 확인과 피드백을 기다리고 있습니다."],"실제 제작":[7,"실제 제작","촬영 결과를 반영해 상세페이지를 제작하고 있습니다."],"내부 검수":[8,"내부 검수","완성본을 최종 검수하고 있습니다."],"최종 납품":[9,"최종 납품","모든 제작과 검수가 완료되었습니다."]};const [currentStep,stepLabel,customerMessage]=map[status]||map["신규 접수"];return{currentStep,totalSteps:9,stepLabel,customerMessage,updatedAt:new Date().toISOString()}};
    const fieldRows=project=>[
      ["접수번호",receiptOf(project)],["고객사명",project.companyName||project.clientName],["브랜드명",project.clientName||project.brandName],["담당자",project.contactName||project.managerName],["연락처",project.contactInfo||project.phone],["이메일",project.email],["제품명",project.productName],["카테고리",project.category],["판매 채널",project.channel],["타깃 고객",project.targetCustomer],["한 줄 설명",project.heroSentence||project.oneLine],["핵심 장점",project.coreStrength||project.features],["제조·품질·인증",project.productionTrust],["구매 혜택",project.purchaseBenefit],["리뷰 키워드",project.reviewKeywords],["옵션·구성",project.options],["필수 문구",project.mustInclude],["금지 표현",project.banWords],["디자인 무드",project.styleTone||project.imageMemo],["참고 링크",project.referenceUrls||project.references],["추가 요청사항",project.additionalNotes||project.clientRequests||project.sourceApplicationText]
    ];
    function render(){const query=$("search").value.trim().toLowerCase();const status=$("statusFilter").value;const selected=new URLSearchParams(location.search).get("projectId")||"";const filtered=projects.filter(project=>{const hay=[project.companyName,project.clientName,project.productName,receiptOf(project)].join(" ").toLowerCase();return(!query||hay.includes(query))&&(!status||project.status===status)});$("count").textContent=`${filtered.length}개 프로젝트`;$("projectList").innerHTML=filtered.length?filtered.map(project=>{const id=keyOf(project);const files=Array.isArray(project.files)?project.files:Array.isArray(project.cloudFiles)?project.cloudFiles:[];return`<details class="project" data-id="${escapeHtml(id)}" ${selected&&[id,project.cloudSubmissionId,project.submissionId].map(String).includes(selected)?"open":""}><summary><div class="project-title"><strong>${escapeHtml(project.productName||"제품명 미입력")}</strong><span>${escapeHtml(project.companyName||project.clientName||"고객사 미입력")} · ${escapeHtml(receiptOf(project))} · ${escapeHtml(project.savedAt||project.createdAt||"")}</span></div><span class="state">${escapeHtml(project.status||"신규 접수")}</span></summary><div class="project-body"><div class="project-actions"><select data-status-id="${escapeHtml(id)}">${statuses.map(item=>`<option ${item===(project.status||"신규 접수")?"selected":""}>${item}</option>`).join("")}</select><button class="secondary" data-download-json="${escapeHtml(id)}">JSON 백업</button><a class="back" href="index.html">관리자툴로 돌아가기</a></div><div class="fields">${fieldRows(project).map(([label,value])=>`<div class="field ${String(value||"").length>110?"wide":""}"><b>${escapeHtml(label)}</b><span class="${text(value)?"":"missing"}">${escapeHtml(text(value)||"미기입·자료없음")}</span></div>`).join("")}</div><section class="files"><h3>첨부 파일 ${files.length}개</h3><div class="file-list">${files.length?files.map((file,index)=>`<button class="file-button" data-file-project="${escapeHtml(id)}" data-file-index="${index}">열기 · ${escapeHtml(file.originalName||file.name||`파일 ${index+1}`)}</button>`).join(""):"<span class=\"missing\">서버 첨부 파일 없음</span>"}</div></section></div></details>`}).join(""):"<div class=\"empty\">조건에 맞는 고객 작성내용이 없습니다.</div>"}
    async function loadProjects(){$("message").className="message";$("message").textContent="중앙 서버 전체목록을 불러오는 중입니다…";try{projects=await window.haoSubmissionSync.listProjects();$("authPanel").hidden=true;$("message").textContent=`서버 연결 완료 · ${projects.length}개 접수 확인`;const used=[...new Set(projects.map(item=>item.status||"신규 접수"))];$("statusFilter").innerHTML='<option value="">전체 상태</option>'+used.map(item=>`<option>${escapeHtml(item)}</option>`).join("");render()}catch(error){$("message").className="message error";$("message").textContent=error?.status===401?"관리자 인증 후 서버 전체목록을 확인할 수 있습니다.":error?.message||"서버 목록을 불러오지 못했습니다.";$("authPanel").hidden=false}}
    $("authenticate").addEventListener("click",()=>{const token=$("adminToken").value.trim();if(!token){$("message").textContent="관리자 키를 입력해주세요.";return}window.haoSubmissionSync.setAdminToken(token);$("adminToken").value="";loadProjects()});
    $("adminToken").addEventListener("keydown",event=>{if(event.key==="Enter")$("authenticate").click()});$("refresh").addEventListener("click",loadProjects);$("search").addEventListener("input",render);$("statusFilter").addEventListener("change",render);
    $("projectList").addEventListener("change",async event=>{const select=event.target.closest("[data-status-id]");if(!select)return;const project=projects.find(item=>keyOf(item)===select.dataset.statusId);if(!project)return;const status=select.value;const updated={...project,cloudSubmissionId:project.cloudSubmissionId||project.submissionId||project.id,status,workflow:{...(project.workflow||{}),customerProgress:progressFor(status)}};try{await window.haoSubmissionSync.updateProjectState(updated);Object.assign(project,updated);$("message").className="message";$("message").textContent=`${project.productName||"프로젝트"} · ${status} 서버 반영 완료`;render()}catch(error){$("message").className="message error";$("message").textContent=error?.message||"상태 저장에 실패했습니다."}});
    $("projectList").addEventListener("click",async event=>{const jsonButton=event.target.closest("[data-download-json]");if(jsonButton){const project=projects.find(item=>keyOf(item)===jsonButton.dataset.downloadJson);const url=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:"application/json"}));const link=document.createElement("a");link.href=url;link.download=`${project.productName||"customer-project"}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}const fileButton=event.target.closest("[data-file-project]");if(!fileButton)return;const project=projects.find(item=>keyOf(item)===fileButton.dataset.fileProject);const files=Array.isArray(project?.files)?project.files:Array.isArray(project?.cloudFiles)?project.cloudFiles:[];const file={...files[Number(fileButton.dataset.fileIndex)],submissionId:project.id||project.submissionId||project.cloudSubmissionId};try{fileButton.disabled=true;fileButton.textContent="불러오는 중…";const blob=await window.haoSubmissionSync.downloadRemoteFile(file);const url=URL.createObjectURL(blob);window.open(url,"_blank","noopener,noreferrer");setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(error){$("message").className="message error";$("message").textContent=error?.message||"첨부 파일을 열지 못했습니다."}finally{fileButton.disabled=false;render()}});
    if(sessionStorage.getItem("haoSubmissionAdminToken")){loadProjects()}else{$("authPanel").hidden=false;$("message").textContent="관리자 키를 입력하면 서버 전체목록을 불러옵니다."}
  }
  </script>
  <script src="customer-submissions.js?v=20260901-intake1"></script>
  <script src="pwa-install.js?v=20260820-3"></script>
</body>
</html>
