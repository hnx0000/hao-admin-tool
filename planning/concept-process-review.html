<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

<body>
  <main class="shell">
    <header class="top">
      <div><span class="eyebrow">PHASE 1 · ANALYSIS PROCESS</span><h1>상품군별 1차 분석 프로세스</h1><p>입력 검증 → 상품군 분석 → 서로 다른 4개 방향 생성 → 자동 평가 → 상위 방향 선정을 수행합니다. 선택 결과는 2차 디자인·촬영 시안으로 전달됩니다.</p></div>
      <span class="status">2단계 프로세스 적용</span>
    </header>
    <section class="toolbar" aria-label="상품 분류 검토">
      <label>상품 대분류<select id="majorCategory"></select></label>
      <label>세부분류<select id="subCategory"></select></label>
      <button id="rerun" type="button">4개 방향 다시 분석</button>
    </section>
    <section class="summary" id="summary"></section>
    <section class="analysis" id="analysis"></section>
    <section class="directions" id="directions"></section>
    <section class="recommend" id="recommend"></section>
    <section class="gate" id="gate"></section>
    <p class="notice">이 화면은 1차 분석 단계입니다. 제품 사실을 확정하거나 새 효능을 만드는 단계가 아니며, 선택한 방향만 2차 디자인 시안으로 전달합니다.</p>
  </main>
  <script src="../data/company-reference-dataset.js?v=20260902-drive28"></script>
  <script src="../concept-process.js?v=20260902-drive28c"></script>
  <script>
    (()=>{
      const $=(s)=>document.querySelector(s);const esc=(v)=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
      const variantKey=new URLSearchParams(location.search).get("variant")==="berry"?"berry":"green";
      const demos={
        green:{clientName:"생즙연구소",brandName:"아침에주스",productName:"클렌즈 그린블렌드",category:"음식 / 음료",majorCategory:"음식",subCategory:"음료",productImages:["assets/saengjeup/cleanse-green-original.png"],oneLine:"키위·케일·양배추·청포도·사과·파인애플을 담은 730mL 냉장 과·채주스",features:["클렌즈 그린블렌드 단일 맛","730mL 병 제품","냉장 보관 제품"],targetCustomer:"과일·채소 음료를 일상에서 간편하게 마시려는 고객",priceRange:"시안 미노출 · 최종 판매 조건 확정 후 별도 반영",desiredMood:["신선함","정돈된 식품 신뢰감","실물 제품 중심"],mustInclude:["클렌즈 그린블렌드","730mL","냉장제품"],evidence:["그린블렌드 제품 원본 라벨 이미지"],references:["Google Drive 2026(기획안) 아침에주스 제품군","서울우유 식품 기획안의 촬영·조판 리듬","호아비 기획안의 근거 제시 방식"],exclusions:["베리블렌드 제품·원료·색상·카피 혼입","두 맛 선택·비교 구조","질병 치료·디톡스 효능처럼 보이는 표현","실물 라벨·병 형태·비율 변경","검증되지 않은 원료 함량과 영양 수치","미확정 가격 강조"]},
        berry:{clientName:"생즙연구소",brandName:"아침에주스",productName:"클렌즈 베리블렌드",category:"음식 / 음료",majorCategory:"음식",subCategory:"음료",productImages:["assets/saengjeup/cleanse-berry-original.png"],oneLine:"블루베리·푸룬·레드비트·배·사과 퓨레·빌베리를 담은 730mL 냉장 과·채주스",features:["클렌즈 베리블렌드 단일 맛","730mL 병 제품","냉장 보관 제품"],targetCustomer:"과일·채소 음료를 일상에서 간편하게 마시려는 고객",priceRange:"시안 미노출 · 최종 판매 조건 확정 후 별도 반영",desiredMood:["신선함","정돈된 식품 신뢰감","실물 제품 중심"],mustInclude:["클렌즈 베리블렌드","730mL","냉장제품"],evidence:["베리블렌드 제품 원본 라벨 이미지"],references:["Google Drive 2026(기획안) 아침에주스 제품군","서울우유 식품 기획안의 촬영·조판 리듬","호아비 기획안의 근거 제시 방식"],exclusions:["그린블렌드 제품·원료·색상·카피 혼입","두 맛 선택·비교 구조","질병 치료·디톡스 효능처럼 보이는 표현","실물 라벨·병 형태·비율 변경","검증되지 않은 원료 함량과 영양 수치","미확정 가격 강조"]}
      };
      const supplements={
        green:{primaryPurchaseReason:"키위·케일·양배추·청포도·사과·파인애플을 담은 냉장 과·채주스",messagePriority:"1. 실제 원재료 구성\n2. 제품과 함께 보이는 맛·음용감\n3. 730mL 용량과 냉장 보관·음용 방법",buyerConcern:"여러 채소가 들어가 맛이 과하게 쓰거나 무겁지 않을지 확인 필요",emphasis:"실물 제품, 원재료, 내용물의 색과 따르는 음용 장면",deEmphasis:"가격, 디톡스 효능, 제품 없는 추상 감성 사진",visualIdentity:"투명한 곡선형 730mL 병, 흰색 리브 캡, 올리브 골드 계열 주스와 라벨, 큰 흰색 Cleanse Juice 영문, 원재료 일러스트",productImageUsage:"시각 방향 분석 우선",shootingConstraints:"실물 제품 수량·개봉 가능 여부 확인 필요. 역할이 다른 최소 4컷을 계획하고 같은 사진을 재사용하지 않음",evidenceBoundary:"제품 원본 라벨에서 확인되는 제품명·730mL·냉장제품·표기 원재료만 사용. 시험·후기·효능 수치는 확인 필요",referenceLikes:"Google Drive 시안의 좌측 촬영 지시·중앙 장축 구성·우측 조판 레퍼런스 3열 구조와 섹션 간 연결",referenceDislikes:"제품 없는 감성 컷, 짧고 추상적인 타이틀, 사진과 디자인이 분리된 카드 반복",variantRule:"제품별 별도 상세페이지"},
        berry:{primaryPurchaseReason:"블루베리·푸룬·레드비트·배·사과 퓨레·빌베리를 담은 냉장 과·채주스",messagePriority:"1. 실제 원재료 구성\n2. 제품과 함께 보이는 맛·음용감\n3. 730mL 용량과 냉장 보관·음용 방법",buyerConcern:"진한 베리와 비트 조합의 맛과 농도가 부담스럽지 않을지 확인 필요",emphasis:"실물 제품, 원재료, 진한 내용물의 색과 따르는 음용 장면",deEmphasis:"가격, 디톡스 효능, 제품 없는 추상 감성 사진",visualIdentity:"투명한 곡선형 730mL 병, 흰색 리브 캡, 짙은 자주색 주스와 검정 라벨, 큰 흰색 Cleanse Juice 영문, 원재료 일러스트",productImageUsage:"시각 방향 분석 우선",shootingConstraints:"실물 제품 수량·개봉 가능 여부 확인 필요. 역할이 다른 최소 4컷을 계획하고 같은 사진을 재사용하지 않음",evidenceBoundary:"제품 원본 라벨에서 확인되는 제품명·730mL·냉장제품·표기 원재료만 사용. 시험·후기·효능 수치는 확인 필요",referenceLikes:"Google Drive 시안의 좌측 촬영 지시·중앙 장축 구성·우측 조판 레퍼런스 3열 구조와 섹션 간 연결",referenceDislikes:"제품 없는 감성 컷, 짧고 추상적인 타이틀, 사진과 디자인이 분리된 카드 반복",variantRule:"제품별 별도 상세페이지"}
      };
      supplements.green.visualPalette=["#f4f0e6","#819464","#b88a4a","#33412d","#24221f"];
      supplements.green.visualAnalysisStatus="관리자 원본 검수 완료";
      supplements.berry.visualPalette=["#f4f0e6","#513547","#944653","#241b24","#24221f"];
      supplements.berry.visualAnalysisStatus="관리자 원본 검수 완료";
      const demo={...demos[variantKey],...supplements[variantKey]};
      const read=()=>{try{const params=new URLSearchParams(location.search);const request=JSON.parse(localStorage.getItem("haoAppGenerationRequest:saengjeup")||"{}");if(request?.project&&(request.project.productName||request.project.clientName)){const merged={...demo,...request.project,variantRule:request.project.variantRule||demo.variantRule};if(!Array.isArray(merged.productImages)||!merged.productImages.length)merged.productImages=demo.productImages;return merged}const list=JSON.parse(localStorage.getItem("customerProjectList")||"[]");const active=JSON.parse(localStorage.getItem("customerProjectInput")||"{}");const id=params.get("projectId");return list.find(p=>String(p.id||"")===id)||((active.productName||active.clientName)?active:demo)}catch{return demo}};
      let source=read();let review;
      function fillTaxonomy(){const major=$("#majorCategory");major.innerHTML=Object.keys(HAO_CONCEPT_PROCESS.TAXONOMY).map(v=>`<option>${esc(v)}</option>`).join("");major.value=source.majorCategory||HAO_CONCEPT_PROCESS.inferClassification(source).major||"기타제품";fillSubs()}
      function fillSubs(){const major=$("#majorCategory").value;const sub=$("#subCategory");sub.innerHTML=`<option value="">선택 필요</option>`+HAO_CONCEPT_PROCESS.TAXONOMY[major].map(v=>`<option>${esc(v)}</option>`).join("");const inferred=source.subCategory||HAO_CONCEPT_PROCESS.inferClassification({...source,majorCategory:major}).sub;sub.value=HAO_CONCEPT_PROCESS.TAXONOMY[major].includes(inferred)?inferred:""}
      function render(){source={...source,majorCategory:$("#majorCategory").value,subCategory:$("#subCategory").value};review=HAO_CONCEPT_PROCESS.buildReview(source);const i=review.input,v=review.validation,a=review.categoryAnalysis;
        $("#summary").innerHTML=`<div class="summary-grid">${[["상품",i.productName],["브랜드",i.brandName],["분류",`${i.majorCategory} · ${i.subCategory}`],["입력 완성도",`${v.completionRate}%`]].map(([k,val])=>`<div class="summary-item"><span>${esc(k)}</span><strong>${esc(val||"확인 필요")}</strong></div>`).join("")}</div><div class="missing">${v.missing.length?v.missing.map(x=>`<span class="chip warn">${esc(x.label)} · 확인 필요</span>`).join(""):`<span class="chip">필수 정보 확인 완료</span>`}</div>`;
        $("#analysis").innerHTML=`<div><h2>${esc(i.majorCategory)} 분석 기준</h2><div class="criteria">${a.criteria.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><p><b>레퍼런스 DB</b> ${esc(a.driveReferenceVersion)} · 3열 기획안 유사도 목표 ${Math.round((a.planningTemplate?.requiredSimilarity||.9)*100)}%</p></div><div class="rule"><b>${esc(i.subCategory||"세부분류 확인 필요")}</b><br>${esc(a.detailRule)}<br><small>${esc(a.risk)}</small><hr><b>제품 이미지 해석</b><br>${esc(review.inputAudit.visualEvidence.identity)}<br><small>${esc(review.inputAudit.visualEvidence.status)} · 제품의 시각 방향 분석이 촬영 예시 생성보다 우선</small></div>`;
        $("#directions").innerHTML=review.directions.map((d,idx)=>`<article class="direction"><header class="direction-head"><div><span class="eyebrow">DIRECTION ${idx+1} · ${esc(d.informationDensity)}</span><h2>${esc(d.conceptName)}</h2><p>${esc(d.coreMessage)}</p></div><div class="score">${d.score}</div></header><div class="moodboard">${d.colors.slice(0,3).map(c=>`<i style="--swatch:${esc(c)}"></i>`).join("")}</div><div class="direction-body"><div class="metrics"><div class="metric"><span>타깃</span>${esc(d.targetCustomer)}</div><div class="metric"><span>분위기</span>${esc(d.overallMood)}</div><div class="metric"><span>기대 효과</span>${esc(d.expectedEffect)}</div></div><dl><dt>색상 방향</dt><dd>${d.colors.map(c=>`<span class="chip" style="border-bottom:3px solid ${esc(c)}">${esc(c)}</span>`).join(" ")}</dd><dt>타이포</dt><dd>${esc(d.typography)}</dd><dt>레이아웃</dt><dd>${esc(d.layout)}</dd><dt>재질·효과</dt><dd>${esc(d.materialAndEffects)}</dd><dt>제품 연출</dt><dd>${esc(d.productDirection)}</dd><dt>추천 이미지</dt><dd>${d.recommendedImages.map(x=>`<span class="chip">${esc(x)}</span>`).join(" ")}</dd><dt>섹션 순서</dt><dd class="section-list">${d.sections.map((x,n)=>`<span class="chip">${n+1}. ${esc(x)}</span>`).join("")}</dd><dt>주의</dt><dd>${esc(d.caution)}</dd></dl></div></article>`).join("");
        $("#recommend").innerHTML=`<h2>자동 평가 상위 2개</h2><div class="recommend-grid">${review.recommended.map(r=>{const d=review.directions.find(x=>x.id===r.id);return`<div class="recommend-card"><b>${r.rank}순위 · ${esc(d.conceptName)} · ${r.score}점</b><p>${esc(r.reason)}</p><label><input type="radio" name="finalDirection" value="${esc(r.id)}"> 최종 방향 후보로 선택</label></div>`}).join("")}</div>`;
      const blocked=!review.productionGate.allowed;$("#gate").innerHTML=`<div><h2>${blocked?"2차 시안 전 확인 필요":"제품별 2차 디자인 시안 생성 가능"}</h2><p>${blocked?review.productionGate.blockers.map(esc).join(" · "):"제품 원본과 필수 분류가 확인되었습니다. 1차 분석과 2차 디자인·촬영 프로세스를 거쳐 Google Drive 2026(기획안) 3열 양식으로 선택한 단일 제품 시안을 생성합니다."}</p></div><div><button id="saveReview" type="button">1차 분석 선택 저장</button> <button id="generateTestDraft" type="button">${esc(i.productName)} 개별 시안 생성</button></div>`;$("#saveReview").onclick=()=>{const selected=document.querySelector('input[name="finalDirection"]:checked');if(!selected){alert("상위 2개 중 검토할 방향을 선택해주세요.");return}localStorage.setItem(`haoConceptProcessReview:${i.productName||"project"}`,JSON.stringify({version:review.version,selected:selected.value,variantKey,at:new Date().toISOString()}));alert("1차 분석 방향을 저장했습니다. 2차 시안 생성 시 이 방향을 적용합니다.")};$("#generateTestDraft").disabled=blocked;$("#generateTestDraft").onclick=()=>{const selected=document.querySelector('input[name="finalDirection"]:checked')?.value||review.recommended[0]?.id;const payload={version:review.version,generatedAt:new Date().toISOString(),project:source,review,selectedDirectionId:selected,variantKey,source:"관리자툴 → 1차 상품 분석 → 단일 제품 2차 디자인·촬영 프로세스 → Google Drive 2026(기획안) 3열 양식"};localStorage.setItem(`haoGeneratedPlanningDraft:saengjeup:${variantKey}`,JSON.stringify(payload));location.href=`saengjeup-design-draft-v3.html?generated=1&variant=${variantKey}&source=app`};
      }
      $("#majorCategory").addEventListener("change",()=>{fillSubs();render()});$("#subCategory").addEventListener("change",render);$("#rerun").addEventListener("click",render);fillTaxonomy();render();
    })();
  </script>
</body>
</html>
